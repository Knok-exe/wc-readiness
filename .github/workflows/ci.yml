name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows too: the README's quick start targets it, and file modes / paths differ there.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      # setup-uv no longer publishes a moving major tag (no @v10); pinned by SHA as its README
      # recommends. Dependabot (.github/dependabot.yml) proposes updates.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv venv --python ${{ matrix.python-version }} && uv pip install -e ".[dev]"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: Offline demo runs
        run: uv run wc-readiness --demo
      - name: Wheel ships the demo data
        run: |
          uv build --wheel
          uv run python -c "import glob, zipfile; n = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); missing = [f for f in ('demo_fhir.json', 'a04_wc_complete.hl7', 'a04_wc_incomplete.hl7') if not any(x.endswith(f) for x in n)]; assert not missing, missing"
